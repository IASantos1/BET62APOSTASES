version = 1

[phases.setup]
nixPkgs = ["nodejs_24"]

[phases.install]
cmds = [
  "echo 'Node:' && node -v",
  "echo 'npm:' && npm -v",
  "npm install -g pnpm@^9.0.0",
  "echo 'pnpm:' && pnpm -v",
  "pnpm config set store-dir /app/.pnpm-store",
  "pnpm install --frozen-lockfile=false",
  "cd server && pnpm prisma generate"
]

[phases.build]
cmds = [
  "cd server && pnpm run build"
]

[start]
cmd = "cd server && pnpm prisma migrate deploy && node dist/server.js"

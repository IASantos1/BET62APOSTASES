<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1116"/>
      <stop offset="0.55" stop-color="#0c0c0e"/>
      <stop offset="1" stop-color="#040405"/>
    </linearGradient>
    <linearGradient id="txt" x1="256" y1="120" x2="256" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a6a"/>
      <stop offset="0.55" stop-color="#e63027"/>
      <stop offset="1" stop-color="#a81811"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5c842"/>
      <stop offset="0.5" stop-color="#e63027"/>
      <stop offset="1" stop-color="#f5c842"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="230" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e63027" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e63027" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fundo opaco de canto a canto (sem transparência nenhuma) — um PNG com cantos transparentes
       é o que causa o ícone a aparecer partido/cortado ao "Adicionar ao Ecrã Principal" no iOS;
       o próprio SO já aplica o seu recorte arredondado por cima, não precisamos de o fazer aqui. -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="220" fill="url(#glow)"/>
  <!-- Anel dourado/vermelho fino, estilo painel futurista, com um pequeno corte no canto superior
       direito (efeito "circuito"/HUD, sem sobrecarregar a leitura em tamanhos pequenos). -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#ring)" stroke-width="9" opacity="0.9"/>
  <path d="M 372 20 L 452 20 L 452 100" fill="none" stroke="#f5c842" stroke-width="9" stroke-linecap="round" opacity="0.55"/>
  <text x="256" y="318" text-anchor="middle" font-family="'Bebas Neue',Arial,sans-serif" font-size="264" font-weight="700" fill="url(#txt)">62</text>
  <rect x="146" y="358" width="220" height="12" rx="6" fill="#f5c842"/>
</svg>

<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bet62 Admin</title>
<meta name="theme-color" content="#0c0c0e">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e63027; --red-dim:#c42820; --bg:#0c0c0e; --surface:#161618; --surface2:#1e1e22;
  --border:#2a2a2e; --text:#f0f0f2; --muted:#8a8a96; --gold:#f5c842; --green:#22c55e; --amber:#f5a623;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.hidden{display:none!important}

/* --- Login --- */
#admin-login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:360px}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:1px;text-align:center;margin-bottom:4px}
.login-logo span{color:var(--red)}
.login-sub{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:24px;text-transform:uppercase;letter-spacing:.5px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}
.btn{background:var(--red);color:#fff;border:none;padding:11px 16px;border-radius:10px;font-weight:700;font-size:.86rem;cursor:pointer}
.btn:hover{background:var(--red-dim)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn.outline:hover{border-color:var(--red);color:var(--red)}
.btn.small{padding:6px 10px;font-size:.76rem;border-radius:8px}
.btn.green{background:var(--green)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.error-note{color:var(--red);font-size:.8rem;margin-top:10px;text-align:center}

/* --- Shell --- */
#admin-shell{display:flex;min-height:100vh}
.admin-sidebar{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.admin-logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:1px;padding:0 8px 18px}
.admin-logo span{color:var(--red)}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px}
.admin-nav-item:hover{background:var(--surface2)}
.admin-nav-item.active{background:rgba(230,48,39,.12);color:var(--red)}
.admin-nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:.68rem;font-weight:700;border-radius:10px;padding:1px 7px;min-width:18px;text-align:center}
.admin-main{flex:1;min-width:0;display:flex;flex-direction:column}
.admin-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
.admin-topbar h1{font-size:1.15rem;font-weight:700}
.admin-user-pill{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted)}
#maintenance-banner{background:var(--amber);color:#1a1200;font-weight:700;text-align:center;padding:8px;font-size:.82rem}
.admin-content{padding:22px;max-width:1200px;width:100%;margin:0 auto}

/* --- KPI cards --- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
.kpi-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi-value{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-sub{font-size:.72rem;color:var(--muted);margin-top:4px}

/* --- Panels / tables --- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px}
.panel h2{font-size:1rem;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.3px;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.table-wrap{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:700}
.badge.ok{background:rgba(34,197,94,.15);color:var(--green)}
.badge.warn{background:rgba(245,166,35,.15);color:var(--amber)}
.badge.bad{background:rgba(230,48,39,.15);color:var(--red)}
.badge.muted{background:var(--surface2);color:var(--muted)}
.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace;font-size:.8rem}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:.8rem;color:var(--muted)}
.empty-note{color:var(--muted);font-size:.85rem;padding:16px;text-align:center}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.detail-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.detail-item .k{font-size:.68rem;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.detail-item .v{font-size:.9rem;font-weight:600}
.section-title{font-size:.9rem;font-weight:700;margin:18px 0 8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.overlay-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto}
.overlay-box h3{margin-bottom:14px;font-size:1rem}
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:.85rem;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.error{border-color:var(--red);color:var(--red)}
.toast.success{border-color:var(--green);color:var(--green)}
@media (max-width:800px){
  #admin-shell{flex-direction:column}
  .admin-sidebar{width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:10px}
  .admin-nav-item{white-space:nowrap}
  .admin-logo{display:none}
}
</style>
</head>
<body>

<div id="admin-login">
  <div class="login-box">
    <div class="login-logo">BET<span>62</span></div>
    <div class="login-sub">Painel Administrativo</div>
    <div class="field"><label>E-mail ou utilizador</label><input id="admin-login-id" type="text" autocomplete="username"></div>
    <div class="field"><label>Palavra-passe</label><input id="admin-login-pw" type="password" autocomplete="current-password"></div>
    <button class="btn" style="width:100%" onclick="AdminApp.login()">Entrar</button>
    <div id="admin-login-error" class="error-note hidden"></div>
  </div>
</div>

<div id="admin-shell" class="hidden">
  <aside class="admin-sidebar">
    <div class="admin-logo">BET<span>62</span> ADMIN</div>
    <div class="admin-nav-item active" data-section="dashboard" onclick="AdminApp.showSection('dashboard')">📊 Dashboard</div>
    <div class="admin-nav-item" data-section="users" onclick="AdminApp.showSection('users')">👤 Utilizadores</div>
    <div class="admin-nav-item" data-section="kyc" onclick="AdminApp.showSection('kyc')">🪪 KYC <span class="admin-nav-badge hidden" id="badge-kyc">0</span></div>
    <div class="admin-nav-item" data-section="withdrawals" onclick="AdminApp.showSection('withdrawals')">💸 Levantamentos <span class="admin-nav-badge hidden" id="badge-withdrawals">0</span></div>
    <div class="admin-nav-item" data-section="deposits" onclick="AdminApp.showSection('deposits')">💰 Depósitos</div>
    <div class="admin-nav-item" data-section="casino" onclick="AdminApp.showSection('casino')">🎰 Cassino</div>
    <div class="admin-nav-item" data-section="responsible" onclick="AdminApp.showSection('responsible')">🛡️ Jogo Responsável</div>
    <div class="admin-nav-item" data-section="mapping" onclick="AdminApp.showSection('mapping')">🔗 Mapeamento <span class="admin-nav-badge hidden" id="badge-mapping">0</span></div>
    <div class="admin-nav-item" data-section="audit" onclick="AdminApp.showSection('audit')">📜 Audit Log</div>
    <div class="admin-nav-item" data-section="settings" onclick="AdminApp.showSection('settings')">⚙️ Definições</div>
    <div class="admin-nav-item" onclick="AdminApp.logout()">🚪 Sair</div>
  </aside>

  <div class="admin-main">
    <div id="maintenance-banner" class="hidden">⚠️ MODO DE MANUTENÇÃO ATIVO — a plataforma está indisponível para jogadores</div>
    <div class="admin-topbar">
      <h1 id="admin-section-title">Dashboard</h1>
      <div class="admin-user-pill">🟢 <span id="admin-username">—</span></div>
    </div>
    <div class="admin-content">

      <section id="section-dashboard"></section>
      <section id="section-users" class="hidden"></section>
      <section id="section-kyc" class="hidden"></section>
      <section id="section-withdrawals" class="hidden"></section>
      <section id="section-deposits" class="hidden"></section>
      <section id="section-casino" class="hidden"></section>
      <section id="section-responsible" class="hidden"></section>
      <section id="section-mapping" class="hidden"></section>
      <section id="section-audit" class="hidden"></section>
      <section id="section-settings" class="hidden"></section>

    </div>
  </div>
</div>

<div id="admin-overlay-root"></div>

<script src="admin.js"></script>
</body>
</html>
